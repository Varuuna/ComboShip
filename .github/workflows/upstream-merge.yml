name: Upstream merge (PRs)

# Weekly (+ manual) sync of the three vendored upstreams (libultraship / soh / mm), on two tracks:
#   - tips:    develop follows each upstream's tracked branch; PRs on `bot/upstream-merge-<key>`.
#   - release: main follows upstream RELEASES only; PRs on `bot/upstream-release-<key>`. soh/mm use
#              their latest GitHub release tag; libultraship uses the newest LUS those tags pin.
# Always reports both tracks in the run's Step Summary. Every upstream that moved gets its OWN PR:
# the mechanical 3-way merge (reusing scripts/upstream-merge.ps1 for the git plumbing), conflict
# markers COMMITTED (PR flagged `has-conflicts`), that key's pin bumped, and
# docs/merges/<date>-<key>.md scaffolded. A pin never moves to a non-descendant. The semantic
# conflict resolution + build-fix chain is finished by a human on the branch — the gate fails until then.
#
# soh/mm `#include` libultraship by path, so the libultraship PR must merge FIRST; their bodies say
# so when it is open. See docs/UPSTREAM_MERGES.md.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only: no branches, PRs or cleanup'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write            # addLabels on the PRs

# A manual run overlapping the cron would have two runs force-pushing the same bot branches.
concurrency:
  group: upstream-merge
  cancel-in-progress: false

jobs:
  # Always runs: reports every upstream on both tracks, then decides which ones get a PR this pass.
  detect:
    runs-on: ubuntu-latest
    outputs:
      # JSON arrays of {track, key, base, head, url, target, targetRef, targetName}, in pins order.
      keys: ${{ steps.plan.outputs.keys }}     # moved AND not already covered by an open PR
      stale: ${{ steps.plan.outputs.stale }}   # up to date — cleanup closes their old PR/branch
      date: ${{ steps.report.outputs.date }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop     # tips PRs target develop; main's pins are read via `git show origin/main:`
          fetch-depth: 0   # full history: keeps prior vendor/upstream objects local for the pins diffs

      - name: Detect updates + changelog
        id: report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}   # releases/latest + the libultraship-pin compare (gh api)
        run: |
          set -euo pipefail
          git config gc.auto 0

          PINS_MAIN="$RUNNER_TEMP/pins-main.json"
          git show origin/main:upstream-pins.json > "$PINS_MAIN"

          # Each PR bumps only its own key's pin lines, which is why the sibling PRs never collide
          # on this file. That holds only while jq round-trips it byte-for-byte — assert it, rather
          # than silently producing whole-file rewrites.
          for f in upstream-pins.json "$PINS_MAIN"; do
            jq . "$f" | diff -q "$f" - \
              || { echo "::error::jq does not round-trip $f byte-for-byte — per-key pin bumps would conflict across the PRs"; exit 1; }
          done

          REPORTS="$RUNNER_TEMP/reports"; mkdir -p "$REPORTS"
          SUM_TIPS="$RUNNER_TEMP/summary-tips.md"; : > "$SUM_TIPS"
          SUM_REL="$RUNNER_TEMP/summary-release.md"; : > "$SUM_REL"
          ITEMS=(); STALE=(); FAIL=0; declare -A TIP=()

          # key|remote-url|branch|prefix|subtree|mergedSha   (subtree empty => repo root maps to prefix)
          # manual:true entries (the shared extractors) are bumped by hand — the merge job only handles
          # libultraship/soh/mm, so reporting them here would raise a PR forever.
          # Read into an array first: a `jq | while` pipe puts the loop in a subshell, so nothing it
          # collects survives (the old version had to re-derive its flag by grepping the report back).
          # Remote/branch come from develop's pins on both tracks; only mergedSha is per base branch.
          mapfile -t rows < <(jq -r '.upstreams | to_entries[] | select(.value.manual != true) | "\(.key)|\(.value.remote)|\(.value.branch)|\(.value.prefix)|\(.value.subtree)|\(.value.mergedSha)"' upstream-pins.json)

          # Classify one key against its resolved target, and write its report when it moved.
          # Args: track key url prefix subtree merged tip targetRef targetName via
          check() {
            local track=$1 key=$2 url=$3 prefix=$4 subtree=$5 merged=$6 tip=$7 ref=$8 name=$9 via=${10}
            local base head sum ours_ref label obj short count ours theirs surface
            if [ "$track" = tips ]; then base=develop; head="bot/upstream-merge-$key"; sum=$SUM_TIPS; ours_ref=HEAD
            else base=main; head="bot/upstream-release-$key"; sum=$SUM_REL; ours_ref=origin/main; fi
            short=$(git rev-parse --short=9 "$tip")
            if [ "$name" = "$short" ]; then label="\`$short\`"; else label="$name (\`$short\`)"; fi
            obj=$(jq -cn --arg track "$track" --arg key "$key" --arg base "$base" --arg head "$head" \
                    --arg url "$url" --arg target "$tip" --arg targetRef "$ref" --arg targetName "$name" \
                    '$ARGS.named')

            if ! git rev-parse -q --verify "$merged^{commit}" > /dev/null; then
              echo "- **$key**: ⏸️ skipped — pinned \`$merged\` not found upstream" >> "$sum"
              echo "::warning::$track $key: pinned $merged not found upstream"
              [ "$track" = tips ] && FAIL=1
              return 0
            fi
            if [ "$(git rev-parse "$merged^{commit}")" = "$tip" ]; then
              STALE+=("$obj")
              if [ "$track" = tips ]; then echo "- **$key**: up to date (\`$merged\`)" >> "$sum"
              else echo "- **$key**: up to date at $label" >> "$sum"; fi
              return 0
            fi
            # Monotonic guard: a pin only ever moves to a descendant.
            if ! git merge-base --is-ancestor "$merged" "$tip"; then
              if [ "$track" = tips ]; then
                echo "- **$key**: ⛔ \`$merged\` is not an ancestor of the \`$short\` tip — tracked branch rewritten?" >> "$sum"
                echo "::error::$key: pinned $merged is not an ancestor of the tracked tip $short"
                FAIL=1
              else
                echo "- **$key**: ⏸️ skipped — $label is not ahead of main's \`$merged\`; waiting for a newer release" >> "$sum"
              fi
              return 0
            fi
            ITEMS+=("$obj")

            count=$(git rev-list --count --first-parent "$merged..$tip")
            echo "- **$key**: $count new merges → $label" >> "$sum"

            # One report file per upstream: it becomes that PR's body and its merge-log scaffold.
            {
              if [ "$track" = tips ]; then echo "### $key — \`$merged\` → \`$short\` ($count merges)"
              else echo "### $key — \`$merged\` → $label → main ($count merges)"; fi
              [ -n "$via" ] && { echo ""; echo "$via"; }
              echo ""
              echo '<details><summary>new commits</summary>'
              echo ""
              echo '```'
              git log --oneline --first-parent -n 100 "$merged..$tip"
              echo '```'
              echo '</details>'
            } > "$REPORTS/$track-$key.md"

            # Conflict surface = our customized files INTERSECT upstream-changed files.
            if [ -n "$subtree" ]; then
              ours=$(git diff --name-only "$merged:$subtree" "$ours_ref:$prefix" | sort)
              theirs=$(git diff --name-only "$merged:$subtree" "$tip:$subtree" | sort)
            else
              ours=$(git diff --name-only "$merged^{tree}" "$ours_ref:$prefix" | sort)
              theirs=$(git diff --name-only "$merged^{tree}" "$tip^{tree}" | sort)
            fi
            surface=$(comm -12 <(echo "$ours") <(echo "$theirs") || true)
            {
              echo ""
              echo "**Conflict surface** (our customized files upstream touched):"
              echo ""
              if [ -n "$surface" ]; then echo '```'; echo "$surface"; echo '```'
              else echo "_none — should auto-merge clean_"; fi
            } >> "$REPORTS/$track-$key.md"
          }

          # --- tips track (develop) ---
          for row in "${rows[@]}"; do
            IFS='|' read -r key url branch prefix subtree merged <<< "$row"
            echo "::group::tips $key"
            git remote add "up-$key" "$url" 2>/dev/null || true
            git -c remote.up-$key.promisor=true fetch --filter=blob:none --no-tags "up-$key" "$branch"
            tip=$(git rev-parse FETCH_HEAD)
            TIP[$key]=$tip
            check tips "$key" "$url" "$prefix" "$subtree" "$merged" "$tip" "" "$(git rev-parse --short=9 "$tip")" ""
            echo "::endgroup::"
          done

          # --- release track (main) ---
          # Errors here are soft (key skipped with a warning), so an API hiccup never blocks develop.
          declare -A RT=() RREF=() RNAME=() RVIA=() RWHY=()
          for key in soh mm; do
            url=$(jq -r --arg k "$key" '.upstreams[$k].remote' upstream-pins.json)
            slug=${url#https://github.com/}; slug=${slug%.git}
            # releases/latest skips drafts, prereleases and the non-release event tags.
            if ! tag=$(gh api "repos/$slug/releases/latest" -q .tag_name) || [ -z "$tag" ]; then
              RWHY[$key]="could not read the latest release of \`$slug\`"; continue
            fi
            # Fetch the tag itself: a release may be tagged off the tracked branch (mm 5.0.1).
            if ! git -c remote.up-$key.promisor=true fetch --filter=blob:none --no-tags "up-$key" "refs/tags/$tag"; then
              RWHY[$key]="could not fetch tag \`$tag\`"; continue
            fi
            RT[$key]=$(git rev-parse 'FETCH_HEAD^{commit}')
            RREF[$key]="refs/tags/$tag"; RNAME[$key]=$tag
            RVIA[$key]="Release notes: <https://github.com/$slug/releases/tag/$tag>"
          done

          # libultraship has no release tags: take the newest LUS the game releases pin.
          lus=""; by=()
          for key in soh mm; do
            [ -n "${RT[$key]:-}" ] || continue
            c=$(git ls-tree "${RT[$key]}" libultraship | awk '$2 == "commit" {print $3}')
            [ -n "$c" ] || continue
            if ! git cat-file -e "$c^{commit}" 2>/dev/null \
               && ! git -c remote.up-libultraship.promisor=true fetch --filter=blob:none --no-tags up-libultraship "$c"; then
              RWHY[libultraship]="could not fetch \`${c:0:9}\` pinned by $key ${RNAME[$key]}"; lus=""; break
            fi
            by+=("$key ${RNAME[$key]}")
            if [ -z "$lus" ] || git merge-base --is-ancestor "$lus" "$c"; then lus=$c
            elif ! git merge-base --is-ancestor "$c" "$lus"; then
              RWHY[libultraship]="soh and mm releases pin diverged libultraship commits"; lus=""; break
            fi
          done
          if [ -n "$lus" ]; then
            RT[libultraship]=$lus; RREF[libultraship]=$lus; RNAME[libultraship]=${lus:0:9}
            via=$(printf '%s, ' "${by[@]}")
            RVIA[libultraship]="Newest libultraship pinned by: ${via%, }"
          elif [ -z "${RWHY[libultraship]:-}" ]; then
            RWHY[libultraship]="no game release to derive a libultraship pin from"
          fi

          # Emit in pins order, so libultraship comes first (the LUS-first rule).
          for row in "${rows[@]}"; do
            IFS='|' read -r key url branch prefix subtree _ <<< "$row"
            echo "::group::release $key"
            if [ -n "${RWHY[$key]:-}" ] || [ -z "${RT[$key]:-}" ]; then
              why=${RWHY[$key]:-no release target}
              echo "- **$key**: ⏸️ skipped — $why" >> "$SUM_REL"
              echo "::warning::release $key: $why"
            else
              merged=$(jq -r --arg k "$key" '.upstreams[$k].mergedSha' "$PINS_MAIN")
              check release "$key" "$url" "$prefix" "$subtree" "$merged" "${RT[$key]}" "${RREF[$key]}" "${RNAME[$key]}" "${RVIA[$key]}"
            fi
            echo "::endgroup::"
          done

          # When soh moved on develop, cross-check the libultraship commit soh pins (its git submodule)
          # against the one we vendor. Both track Kenix3 `port-maintenance`, so a mismatch is a pin
          # LAG, not a line divergence — but soh code in this range may need a LUS fix we don't have
          # yet. Surface the delta so cherry-picks (or a pin bump) happen up front instead of via a
          # cryptic /WX build failure. Lands in the develop soh PR only. See docs/UPSTREAM_MERGES.md.
          if [ -n "${TIP[soh]:-}" ] && [ -f "$REPORTS/tips-soh.md" ]; then
            lus_expected=$(git ls-tree "${TIP[soh]}" libultraship 2>/dev/null | awk '{print $3}' || true)
            lus_ours=$(jq -r '.upstreams.libultraship.mergedSha' upstream-pins.json)
            if [ -n "$lus_expected" ] && [ "${lus_expected:0:9}" != "${lus_ours:0:9}" ]; then
              {
                echo ""
                echo "### ⚠️ libultraship pin lag: soh expects a newer LUS"
                echo ""
                echo "soh pins libultraship \`${lus_expected:0:9}\`; ComboShip vendors \`${lus_ours}\`."
                echo "Both are on Kenix3 \`port-maintenance\`, so this is a pin lag, not a line divergence —"
                echo "but soh code in this range may need a LUS fix we do not have. Either **cherry-pick the"
                echo "fixes you need** into \`libultraship/\` or **advance our libultraship pin** to cover them."
                echo "We never adopt soh's submodule pin wholesale."
                echo ""
                echo "<https://github.com/Kenix3/libultraship/compare/${lus_ours}...${lus_expected}>"
                echo ""
                echo '<details><summary>LUS commits soh expects that you may be missing</summary>'
                echo ""
                echo '```'
                gh api "repos/Kenix3/libultraship/compare/${lus_ours}...${lus_expected}" \
                  -q '.commits[:40][] | "\(.sha[0:9])  \(.commit.message | split("\n")[0])"' 2>/dev/null \
                  || echo "(compare unavailable — open the link above)"
                echo '```'
                echo '</details>'
              } >> "$REPORTS/tips-soh.md"
            fi
          fi

          # printf of an empty array still emits one blank line, which `jq -s` renders as [].
          echo "moved=$(printf '%s\n' "${ITEMS[@]}" | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "stale=$(printf '%s\n' "${STALE[@]}" | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

          # Always make the result unambiguous on the run's summary page.
          {
            if [ ${#ITEMS[@]} -eq 0 ]; then echo "## ✅ Upstream check — nothing new to merge"; \
            else echo "## 🔔 Upstream updates found — opening one PR per upstream"; fi
            echo ""
            echo "### develop — upstream branch tips"
            echo ""
            cat "$SUM_TIPS"
            echo ""
            echo "### main — upstream releases"
            echo ""
            cat "$SUM_REL"
            for obj in "${ITEMS[@]}"; do
              echo ""; cat "$REPORTS/$(jq -r '"\(.track)-\(.key)"' <<< "$obj").md"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$FAIL" -eq 0 ] || { echo "::error::develop track has a pin that is not an ancestor of its tip — see the summary"; exit 1; }

      # Never clobber in-progress work: an upstream whose PR is already open is dropped from this
      # pass. Its siblings still proceed. (Pins stay old until a PR merges, so a dropped key keeps
      # showing as moved on later runs.)
      - name: Drop upstreams with a PR already open
        id: plan
        uses: actions/github-script@v8
        env:
          MOVED: ${{ steps.report.outputs.moved }}
          STALE: ${{ steps.report.outputs.stale }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            if (process.env.DRY_RUN === 'true') {
              await core.summary.addRaw('\n> 🧪 **Dry run** — no branches, PRs or cleanup.\n').write();
              core.setOutput('keys', '[]');
              core.setOutput('stale', '[]');
              return;
            }
            const todo = [];
            for (const it of JSON.parse(process.env.MOVED)) {
              const open = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${it.head}`
              });
              if (open.data.length) {
                const n = open.data[0].number;
                core.notice(`${it.track} ${it.key}: PR #${n} already open — leaving it untouched.`);
                await core.summary.addRaw(`\n> ℹ️ **${it.key}** (${it.base}): PR #${n} is already open — left untouched. New upstream commits may have landed since; close it (and delete the branch) to regenerate.\n`).write();
              } else {
                todo.push(it);
              }
            }
            core.setOutput('keys', JSON.stringify(todo));
            core.setOutput('stale', process.env.STALE);

      # The summary is the whole point of the weekly run, so never leave the page blank: the detect
      # step writes it last, and anything that trips before then (the pins assert, a fetch) lands here.
      - name: Note detection failure on the summary
        if: failure()
        shell: bash
        run: echo "## ⛔ Upstream check failed before it could report — see the job log" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload per-upstream reports
        if: steps.plan.outputs.keys != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: error

  # One leg per (track, upstream) that moved: its own branch, its own bookkeeping commit, its own PR.
  merge:
    needs: detect
    if: needs.detect.outputs.keys != '[]'
    name: merge (${{ matrix.track }} ${{ matrix.key }})
    runs-on: ubuntu-latest
    strategy:
      # max-parallel 1 keeps the documented libultraship -> soh -> mm order per track (detect emits
      # keys in upstream-pins.json order), which also means the libultraship PR already exists by
      # the time the soh/mm legs write their "merge that one first" note.
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.keys) }}
    env:
      U_TRACK: ${{ matrix.track }}
      U_KEY: ${{ matrix.key }}
      U_BASE_BRANCH: ${{ matrix.base }}
      U_HEAD: ${{ matrix.head }}
      U_URL: ${{ matrix.url }}
      U_TARGET: ${{ matrix.target }}
      U_TARGET_REF: ${{ matrix.targetRef }}
      U_TARGET_NAME: ${{ matrix.targetName }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.base }}
          fetch-depth: 0
          # PAT so the opened PR triggers build-artifacts.yml's gate (a PR opened by the
          # default GITHUB_TOKEN does NOT trigger other workflows). Falls back to GITHUB_TOKEN if
          # unset (PR is still created; a maintainer push then triggers the build).
          token: ${{ secrets.UPSTREAM_PR_PAT || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: upstream-reports
          path: ${{ runner.temp }}/reports

      # Prepare this upstream's branch + the merge base. The base is synthesized from
      # upstream-pins.json, NOT from the base branch's merge commits: pins are file content so they
      # survive a squash-merged PR; merge commits don't (the 2026-07-13 run derived a stale
      # pre-squash base and re-conflicted upstream ranges merged weeks earlier).
      - name: Fetch upstream + synthesize merge base
        shell: bash
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config user.name  'comboship-bot'
          git config user.email 'comboship-bot@users.noreply.github.com'

          key=$U_KEY
          # Remote names must match scripts/upstream-merge.ps1's $remotes map, or the engine adds a
          # second remote for the same URL in the next step.
          case "$key" in
            libultraship) remote=up-lus ;;
            soh)          remote=up-soh ;;
            mm)           remote=up-mm  ;;
            *) echo "::error::unknown upstream key '$key'"; exit 1 ;;
          esac
          branch=$(jq -r ".upstreams.\"$key\".branch"   upstream-pins.json)
          prefix=$(jq -r ".upstreams.\"$key\".prefix"   upstream-pins.json)
          subtree=$(jq -r ".upstreams.\"$key\".subtree" upstream-pins.json)
          merged=$(jq -r ".upstreams.\"$key\".mergedSha" upstream-pins.json)

          # This job has its own checkout, so none of the detect job's fetched objects are here — and
          # the base below needs the upstream tree at mergedSha. Same remote setup the engine uses.
          if ! git remote | grep -qx "$remote"; then
            git remote add --no-tags -t "$branch" "$remote" "$U_URL"
            git config "remote.$remote.promisor" true
            git config "remote.$remote.partialclonefilter" 'blob:none'
          fi
          git fetch "$remote" "$branch"
          [ -z "$U_TARGET_REF" ] || git fetch "$remote" "$U_TARGET_REF"

          # vendor-<key> starts at a base commit whose tree = upstream at the last-merged SHA grafted
          # under our prefix (the same mktree construction the engine uses for tips).
          if [ -n "$subtree" ]; then treeRef="$merged:$subtree"; else treeRef="$merged^{tree}"; fi
          sub=$(git rev-parse --verify "$treeRef")
          baseTree=$(printf '040000 tree %s\t%s\n' "$sub" "$prefix" | git mktree)
          base=$(git commit-tree "$baseTree" -m "vendor base: $key $merged")
          git branch -f "vendor-$key" "$base"
          echo "vendor-$key base = $(git rev-parse --short=9 "$base") (upstream $merged)"

          # Run the engine from the workflow's own commit: main's copy may predate the release track.
          git show "$GITHUB_SHA:scripts/upstream-merge.ps1" > "$RUNNER_TEMP/upstream-merge.ps1"

          git switch -C "$U_HEAD"

          {
            echo "U_BASE=$(git rev-parse HEAD)"   # the base branch's tip, before this leg's commits
            echo "U_REMOTE=$remote"
            echo "U_BRANCH=$branch"
            echo "U_PREFIX=$prefix"
            echo "U_SUBTREE=$subtree"
            echo "U_MERGED=$merged"
          } >> "$GITHUB_ENV"

      # Reuse the local merge engine for the hard git plumbing: blob-hydrate + rebuild vendor-<key>
      # to the new upstream target. NO -Merge (the merge/commit policy is below).
      - name: Rebuild vendor branch
        shell: pwsh
        run: |
          # Guard: PS 7.4 treats native-command stderr as terminating under ErrorActionPreference=Stop;
          # git writes progress to stderr. Keep the engine's own behavior identical to a local run.
          $PSNativeCommandUseErrorActionPreference = $false
          $engine = Join-Path $env:RUNNER_TEMP 'upstream-merge.ps1'
          if ($env:U_TRACK -eq 'release') {
            & $engine -Only $env:U_KEY -Target $env:U_TARGET_REF -Depth 1000 -RepoRoot $PWD
          } else {
            & $engine -Only $env:U_KEY -Depth 1000 -RepoRoot $PWD
          }

      # Mechanical 3-way merge via merge-tree with the pins-derived base passed explicitly (the base
      # branch's ancestry is irrelevant, so squash-merged PRs can't stale it). Conflict markers land
      # in the committed tree so the PR is always a complete unit; the human resolves them on the branch.
      - name: Merge + bookkeeping
        id: merge
        shell: bash
        env:
          DATE: ${{ needs.detect.outputs.date }}
        run: |
          set -euo pipefail
          if [ "$U_TRACK" = release ]; then tip=$U_TARGET; else tip=$(git rev-parse "$U_REMOTE/$U_BRANCH"); fi
          new=$(git rev-parse --short=9 "$tip")

          # The engine resolved the target again; refuse if it no longer matches (tag re-pointed mid-run).
          if [ -n "$U_SUBTREE" ]; then want=$(git rev-parse "$tip:$U_SUBTREE"); else want=$(git rev-parse "$tip^{tree}"); fi
          if [ "$(git rev-parse "vendor-$U_KEY:$U_PREFIX")" != "$want" ]; then
            echo "::error::vendor-$U_KEY does not match target $new — upstream moved during the run; re-run"
            exit 1
          fi

          # Explicit-base 3-way merge. The base = the synthesized vendor commit from the previous step
          # (parent of the rebuilt vendor tip). renames=false for ALL folders — rename detection is
          # what spliced soh chest materials into mm assets (#50 and 2026-07-13). On conflicts
          # merge-tree still writes a full tree (markers baked in) and exits 1 — exactly the
          # commit-the-markers policy; any other exit is a real error.
          base=$(git rev-parse "vendor-$U_KEY^")
          set +e
          out=$(git -c merge.renames=false merge-tree --write-tree --name-only \
                  --merge-base="$base" HEAD "vendor-$U_KEY")
          status=$?
          set -e
          tree=${out%%$'\n'*}   # first line; not `| head -1`, which SIGPIPEs a big $out under pipefail
          if [ "$status" -gt 1 ] || [ -z "$tree" ]; then
            echo "::error::merge-tree failed for $U_KEY (exit $status)"
            printf '%s\n' "$out"
            exit 1
          fi

          if [ "$U_TRACK" = release ]; then msg="merge($U_KEY): release $U_TARGET_NAME $U_MERGED -> $new"
          else msg="merge($U_KEY): $U_BRANCH $U_MERGED -> $new"; fi
          commit=$(git commit-tree "$tree" -p HEAD -p "vendor-$U_KEY" -m "$msg")
          git reset --hard "$commit"

          # Tripwire: the merge must never touch files outside this upstream's own prefix —
          # cross-folder writes are the asset-splice signature (mm assets corrupted by the soh merge,
          # twice). It is also what keeps the sibling PRs from overlapping.
          stray=$(git diff --name-only HEAD^ HEAD | grep -v "^$U_PREFIX/" || true)
          if [ -n "$stray" ]; then
            echo "::error::$U_KEY merge touched files outside $U_PREFIX/ — aborting"
            echo "$stray"
            exit 1
          fi

          # An upstream tip can move without changing our mapped prefix at all (soh/mm map a subtree,
          # so a root-only upstream commit is invisible here; libultraship did it at fca3b034bd when
          # we'd already hand-ported the range). The pin bump alone still shifts the derived build
          # version, so say so on the PR instead of leaving a diff with no code.
          empty=0
          git diff --quiet HEAD^ HEAD && empty=1

          CONFLICTS_FILE="$RUNNER_TEMP/conflicts.txt"; : > "$CONFLICTS_FILE"
          if [ "$status" -eq 1 ]; then
            # merge-tree output: line 1 = tree OID, then conflicted paths until the blank line that
            # separates them from the informational messages.
            awk 'NR>1 { if ($0 == "") exit; print }' <<< "$out" | sort -u > "$CONFLICTS_FILE"
            echo "  $U_KEY: CONFLICTS committed as markers"
          else
            echo "  $U_KEY: clean"
          fi

          # Bump this key's pin only; mergedTag records a release tag (informational, mergedSha is
          # the truth). jq is format-idempotent on this file, so sibling PRs never collide here.
          tag=""
          if [ "$U_TRACK" = release ] && [ "$U_KEY" != libultraship ]; then tag=$U_TARGET_NAME; fi
          tmp=$(mktemp)
          jq --arg k "$U_KEY" --arg sha "$new" --arg d "$DATE" --arg tag "$tag" \
             '.upstreams[$k].mergedSha=$sha | .upstreams[$k].mergedDate=$d
              | if $tag == "" then del(.upstreams[$k].mergedTag) else .upstreams[$k].mergedTag=$tag end' \
             upstream-pins.json > "$tmp" && mv "$tmp" upstream-pins.json

          # Per-upstream merge log: a shared docs/merges/<date>.md would be an add/add conflict for
          # whichever sibling PR merges second. Suffix on collision so re-merging the same upstream
          # on the same day can't truncate the log a human already wrote and landed.
          mkdir -p docs/merges
          log="docs/merges/$DATE-$U_KEY.md"; n=2
          while [ -e "$log" ]; do log="docs/merges/$DATE-$U_KEY-$n.md"; n=$((n+1)); done
          {
            if [ "$U_TRACK" = release ]; then echo "# Upstream release — $U_KEY $U_TARGET_NAME → main — $DATE"
            else echo "# Upstream merge — $U_KEY — $DATE"; fi
            echo ""
            echo "> Auto-generated by \`upstream-merge.yml\`. Fill in the post-merge changes (build-fix"
            echo "> chain, COMBO_BUILD guards, runtime fixes) before merging, then link this file from"
            echo "> docs/UPSTREAM_MERGES.md. See that doc for the policy."
            echo ""
            cat "$RUNNER_TEMP/reports/$U_TRACK-$U_KEY.md"
          } > "$log"

          git add -A
          git commit -m "chore(upstream): bump $U_KEY pin + merge log $DATE"

          # The force-push regenerates the branch from scratch, so refuse if the remote tip carries
          # anything a human wrote. --force-with-lease can't help (we hold no lease for a branch we
          # never fetched), and the open-PR guard misses a branch whose PR was closed by hand.
          if git fetch --no-tags origin "$U_HEAD" 2>/dev/null; then
            authors=$(git log --format=%an FETCH_HEAD --not "$U_BASE" | sort -u)
            if [ -n "$(printf '%s\n' "$authors" | grep -v '^comboship-bot$' || true)" ]; then
              echo "::error::$U_HEAD has non-bot commits ahead of $U_BASE_BRANCH — refusing to force-push over them"
              printf '%s\n' "$authors"
              exit 1
            fi
          fi
          git push --force origin "HEAD:$U_HEAD"

          if [ "$status" -eq 1 ]; then echo "had_conflicts=1" >> "$GITHUB_OUTPUT"
          else echo "had_conflicts=0" >> "$GITHUB_OUTPUT"; fi
          echo "conflicts_path=$CONFLICTS_FILE" >> "$GITHUB_OUTPUT"
          echo "empty=$empty" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Open/update PR
        uses: actions/github-script@v8
        env:
          DATE: ${{ needs.detect.outputs.date }}
          REPORTS: ${{ runner.temp }}/reports
          CONFLICTS_PATH: ${{ steps.merge.outputs.conflicts_path }}
          HAD_CONFLICTS: ${{ steps.merge.outputs.had_conflicts }}
          EMPTY: ${{ steps.merge.outputs.empty }}
          NEW_SHA: ${{ steps.merge.outputs.new }}
          KEYS: ${{ needs.detect.outputs.keys }}
        with:
          # PAT so pulls.create is allowed — GITHUB_TOKEN is blocked from creating PRs.
          github-token: ${{ secrets.UPSTREAM_PR_PAT || github.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const { U_TRACK: track, U_KEY: key, U_HEAD: head, U_BASE_BRANCH: base } = process.env;
            const release = track === 'release';
            const prefix = release ? 'bot/upstream-release-' : 'bot/upstream-merge-';
            const title = release
              ? `Upstream release: ${key} ${process.env.U_TARGET_NAME} → ${base}`
              : `Upstream merge: ${key} → ${process.env.DATE}`;

            let body = fs.readFileSync(`${process.env.REPORTS}/${track}-${key}.md`, 'utf8');

            if (process.env.HAD_CONFLICTS === '1') {
              let conf = '';
              try { conf = fs.readFileSync(process.env.CONFLICTS_PATH, 'utf8'); } catch (e) {}
              body = '> **Conflicts committed as markers** — resolve them on the `' + head + '` '
                   + 'branch (keep COMBO_BUILD blocks; see docs/UPSTREAM_MERGES.md). The required '
                   + '`gate` check stays red, and lists each `file:line`, until they are gone.\n\n'
                   + '<details><summary>conflicted files</summary>\n\n```\n' + conf + '```\n</details>\n\n'
                   + body;
            }

            if (process.env.EMPTY === '1') {
              body = `> **Bookkeeping only** — \`${key}\` moved to \`${process.env.NEW_SHA}\` but the `
                   + 'merge changed no files under our mapped prefix (we already carry the range, or '
                   + 'upstream only touched paths outside it). The pin bump still shifts the derived '
                   + 'build version, so the port archives need regenerating — see docs/UPSTREAM_MERGES.md.\n\n'
                   + body;
            }

            // soh/mm `#include` libultraship by path (docs/UPSTREAM_MERGES.md), so its PR lands first.
            if (key !== 'libultraship') {
              const lus = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${prefix}libultraship`
              });
              if (lus.data.length) {
                body = `> ⚠️ **Merge #${lus.data[0].number} (libultraship) first** — \`${key}/\` `
                     + '`#include`s libultraship by path, so it expects the newer engine.\n\n' + body;
              } else if (JSON.parse(process.env.KEYS).some(k => k.track === track && k.key === 'libultraship')) {
                // libultraship moved this pass but has no PR — its leg failed. Still warn: this
                // branch expects the newer engine, so landing it alone can break the build.
                body = '> ⚠️ **libultraship also moved this pass but its PR was not opened** (that leg '
                     + `failed — see the run log). \`${key}/\` \`#include\`s libultraship by path, so `
                     + 'land the engine bump before this.\n\n' + body;
              }
            }

            if (release) {
              body += '\n\n> **main = release track.** Never merge develop into main while any develop pin '
                    + 'is past main\'s; cherry-pick instead (docs/UPSTREAM_MERGES.md).';
            }
            body += '\n\n---\n_Auto-generated by upstream-merge.yml. Pin bump + merge-log scaffold are already committed._';

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`
            });

            let number;
            if (existing.data.length) {
              number = existing.data[0].number;
              await github.rest.pulls.update({ owner, repo, pull_number: number, title, body });
            } else {
              const pr = await github.rest.pulls.create({ owner, repo, head, base, title, body });
              number = pr.data.number;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: number,
              labels: release ? ['upstream-merge', 'upstream-release'] : ['upstream-merge']
            });
            if (process.env.HAD_CONFLICTS === '1') {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: number, labels: ['has-conflicts']
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: 'has-conflicts'
                });
              } catch (e) { /* label not present */ }
            }
            core.notice(`PR #${number} ready: ${title}`);

  # Point each track's open PRs at each other, so resolving one shows what else is in flight.
  crosslink:
    needs: [detect, merge]
    # !cancelled() rather than always(): run even when a leg failed (its siblings still have PRs),
    # but not when detect failed — its empty `keys` output would pass a `!= '[]'` test.
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.keys != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.UPSTREAM_PR_PAT || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });

            // Rewrite a marked block rather than appending, so weekly re-runs don't stack copies.
            const START = '<!-- siblings -->', END = '<!-- /siblings -->';
            const re = new RegExp(`${START}[\\s\\S]*?${END}`);
            for (const [prefix, what] of [['bot/upstream-merge-', 'upstream-merge'],
                                          ['bot/upstream-release-', 'upstream-release']]) {
              const bots = open.filter(p => p.head.ref.startsWith(prefix));
              if (bots.length < 2) continue;
              for (const pr of bots) {
                const others = bots.filter(o => o.number !== pr.number).map(o =>
                  `- #${o.number} — \`${o.head.ref.replace(prefix, '')}\``).join('\n');
                const block = `${START}\n**Other open ${what} PRs:**\n${others}\n${END}`;
                const old = pr.body || '';
                const body = re.test(old) ? old.replace(re, block) : `${old}\n\n${block}`;
                if (body !== old) {
                  await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body });
                }
              }
            }

  # Tidy up upstreams with nothing new, so a finished merge's PR/branch doesn't linger.
  cleanup:
    needs: detect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          STALE: ${{ needs.detect.outputs.stale }}
        with:
          github-token: ${{ secrets.UPSTREAM_PR_PAT || github.token }}
          script: |
            const { owner, repo } = context.repo;
            // The pre-split 'bot/upstream-merge' branch is deliberately NOT swept here: it can hold
            // an in-flight PR, and "stale" is not evidence that its work landed. Delete it by hand.
            // Skipped release keys are never in `stale`, so their branches are left alone too.
            const stale = JSON.parse(process.env.STALE || '[]');

            for (const { key, base, head } of stale) {
              // An up-to-date pin does not prove this branch's work landed — someone may have merged
              // that upstream by hand while the bot branch still carried hand-resolved conflicts.
              // Only discard a branch whose unlanded commits are all the bot's own.
              let regenerable = true;
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${base}...${head}`
                });
                const human = cmp.data.commits.filter(c =>
                  c.commit.author.name !== 'comboship-bot' && c.author?.login !== 'comboship-bot');
                if (human.length) {
                  regenerable = false;
                  core.warning(`${key}: ${head} has ${human.length} non-bot commit(s) ahead of ${base} — leaving it alone.`);
                  await core.summary.addRaw(`\n> ⚠️ \`${key}\` is up to date on ${base}, but \`${head}\` carries hand-written commits that are not on ${base} — review and delete it yourself.\n`).write();
                }
              } catch (e) {
                if (e.status === 404) continue;   // branch already gone
                throw e;
              }
              if (!regenerable) continue;

              const open = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${head}`
              });
              for (const pr of open.data) {
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
                core.notice(`closed stale PR #${pr.number} (${head})`);
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${head}` });
              } catch (e) { /* branch already gone */ }
            }
