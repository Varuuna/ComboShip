name: pr-artifacts

# After "Build Artifacts (Windows)" finishes for a PR, post (or update) a comment on that PR with
# nightly.link download links for each uploaded artifact. Runs in the base-repo context via
# workflow_run, so it can comment even on fork PRs. Mirrors HarbourMasters/Shipwright/pr-artifacts.yml.

on:
  workflow_run:
    workflows: [Build Artifacts (Windows)]
    types:
      - completed

# The repo's default workflow token is read-only, so pr-section can't edit the PR body
# ("Resource not accessible by integration"). Grant just this workflow PR write (least privilege;
# workflow_run is a trusted context). contents:read keeps actions/checkout-style reads working.
permissions:
  contents: read
  pull-requests: write

jobs:
  pr-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - id: 'pr-number'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const {owner, repo} = context.repo;
            const pullHeadSHA = '${{github.event.workflow_run.head_sha}}';
            const pullUserId = ${{github.event.sender.id}};
            const prNumber = await (async () => {
              for await (const { data } of github.paginate.iterator(
                github.rest.pulls.list, { owner, repo }
              )) {
                for (const pull of data) {
                  if (pull.head.sha === pullHeadSHA && pull.user.id === pullUserId) {
                    return pull.number;
                  }
                }
              }
            })();

            if (!prNumber) {
              return core.error(`No matching pull request found`);
            }

            return prNumber;
      - id: 'artifacts-text'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            return allArtifacts.data.artifacts.reduce((acc, item) => {
              acc += `
              - [${item.name}.zip](https://nightly.link/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${item.id}.zip)`;
              return acc;
            }, '### Build Artifacts');
      - id: 'add-to-pr'
        uses: garrettjoecox/pr-section@4.0.0
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          pr-number: ${{ steps.pr-number.outputs.result }}
          section-name: 'artifacts'
          section-value: '${{ steps.artifacts-text.outputs.result }}'
